<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão de devocionais — Projeto Bíblico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  :root{
    --ground:#F4F5F1; --surface:#fff; --ink:#1D2B24; --muted:#5B6472; --line:#E0E2DC;
    --green:#2F5D45; --green-soft:#E4EDE7; --brass:#B98A3C;
    --ok:#3C7A54; --warn:#B27F2A; --bad:#A6483C;
  }
  @media (prefers-color-scheme:dark){
    :root{ --ground:#16211C; --surface:#1A2620; --ink:#E7EAE4; --muted:#9AA9A0;
      --line:#2B3A32; --green:#7FB394; --green-soft:#1E2A22; --brass:#D8AD64;
      --ok:#6FB187; --warn:#D8AD64; --bad:#E08579; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;padding-bottom:4rem}
  .wrap{max-width:44rem;margin:0 auto;padding:0 1rem}

  #gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1rem;padding:2rem;text-align:center}
  #gate h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:1.5rem}
  #gate p{color:var(--muted);font-size:.9rem;max-width:22rem}
  #gate form{display:flex;gap:.5rem;width:100%;max-width:20rem}
  #gate input{flex:1;font:inherit;font-size:1rem;padding:.6rem .8rem;border:1px solid var(--line);
    border-radius:.5rem;background:var(--surface);color:var(--ink);text-align:center;letter-spacing:.2em}
  #gate button{font:inherit;font-weight:600;padding:.6rem 1rem;border:0;border-radius:.5rem;background:var(--green);color:#fff;cursor:pointer}
  #gate .err{color:var(--bad);font-size:.85rem;min-height:1rem}

  header{position:sticky;top:0;z-index:5;background:var(--ground);border-bottom:1px solid var(--line);padding:.7rem 0}
  header .wrap{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
  h1.hd{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:1.1rem;flex:1}
  .prog{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:.4rem;width:100%}
  .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .role{width:100%;display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--muted)}
  .seg{display:flex;border:1px solid var(--line);border-radius:.5rem;overflow:hidden;flex:1;max-width:16rem}
  .seg button{flex:1;font:inherit;font-size:.82rem;font-weight:600;padding:.4rem .3rem;border:0;
    background:var(--surface);color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--green);color:#fff}
  .who input{width:100%;font:inherit;font-size:.82rem;padding:.35rem .5rem;border:1px solid var(--line);
    border-radius:.4rem;background:var(--surface);color:var(--ink);margin-top:.4rem}

  main{padding-top:1.1rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:1.1rem 1.1rem 1.2rem;margin-bottom:1rem;box-shadow:0 6px 20px -14px rgba(0,0,0,.15)}
  .badges{display:flex;gap:.4rem;margin-bottom:.5rem;flex-wrap:wrap}
  .badge{font-size:.68rem;font-weight:600;letter-spacing:.03em;padding:.15rem .5rem;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);background:var(--ground)}
  .badge.ap{color:#fff;background:var(--ok);border-color:var(--ok)}
  .badge.aj{color:#fff;background:var(--warn);border-color:var(--warn)}
  .badge.re{color:#fff;background:var(--bad);border-color:var(--bad)}
  .num{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:1.4rem;line-height:1.2;margin:.15rem 0 .7rem}
  .verse{border-left:3px solid var(--green-soft);padding-left:.9rem;margin:.6rem 0 1rem}
  .verse b{color:var(--green);font-size:.9rem}
  .verse p{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:1.05rem;margin-top:.2rem}
  .refl p{margin:.7rem 0}
  .field{margin-top:.9rem;font-size:.95rem}
  .field .lab{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.1rem}
  details{margin-top:1rem;font-size:.88rem;color:var(--muted)}
  details summary{cursor:pointer;color:var(--green);font-size:.82rem}
  details ul{margin:.5rem 0 0 1.1rem}

  .actlab{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:1.1rem}
  .actions{display:flex;gap:.5rem;margin-top:.4rem;flex-wrap:wrap}
  .actions button{flex:1;min-width:8rem;font:inherit;font-weight:600;font-size:.9rem;padding:.6rem .5rem;
    border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s}
  .actions button:hover{border-color:var(--muted)}
  .actions button[aria-pressed="true"].ap{background:var(--ok);border-color:var(--ok);color:#fff}
  .actions button[aria-pressed="true"].aj{background:var(--warn);border-color:var(--warn);color:#fff}
  .actions button[aria-pressed="true"].re{background:var(--bad);border-color:var(--bad);color:#fff}
  .notes{margin-top:.7rem;display:none} .notes.show{display:block}
  .notes textarea{width:100%;min-height:4rem;font:inherit;font-size:.9rem;padding:.6rem;border:1px solid var(--line);
    border-radius:.5rem;background:var(--ground);color:var(--ink);resize:vertical}
  .saved{font-size:.75rem;color:var(--muted);margin-top:.4rem;min-height:1rem}

  footer{text-align:center;margin-top:1.5rem;font-size:.8rem;color:var(--muted)}
  footer button{font:inherit;font-size:.8rem;padding:.5rem .9rem;border:1px solid var(--line);border-radius:.5rem;
    background:var(--surface);color:var(--ink);cursor:pointer;margin:.3rem}
  .empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="gate">
  <h1>Revisão de devocionais</h1>
  <p>Este material é confidencial. Digite a senha de acesso.</p>
  <form id="gateForm">
    <input id="pw" type="password" inputmode="numeric" placeholder="senha" autocomplete="off" autofocus>
    <button type="submit">Entrar</button>
  </form>
  <div class="err" id="gateErr"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="wrap">
      <h1 class="hd">Revisão de devocionais</h1>
      <span class="prog" id="prog">0 / 0</span>
      <div class="bar"><i id="barfill"></i></div>
      <div class="role">
        Revisando como:
        <div class="seg" id="seg">
          <button data-papel="dono" aria-pressed="true">Dono</button>
          <button data-papel="teologo" aria-pressed="false">Revisor teológico</button>
        </div>
      </div>
      <label class="who" style="width:100%">
        <input id="who" placeholder="seu nome (para registro)" autocomplete="name">
      </label>
    </div>
  </header>
  <main class="wrap" id="list"></main>
  <footer class="wrap">
    <p>As respostas são salvas automaticamente. Se algo falhar, use o backup.</p>
    <button id="backup">Baixar backup (.json)</button>
    <button id="reenviar">Reenviar tudo</button>
  </footer>
</div>

<script src="config.js"></script>
<script>
(function(){
  var CFG = window.REVIEW_CONFIG || {};
  var LS = "pb-review-v2";
  var store = {};
  try { store = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){}
  if(!store.__papel) store.__papel = "dono";
  function persist(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }
  var b64d = function(s){ return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0);}); };
  var CLS = {Aprovar:"ap", Ajustar:"aj", Rejeitar:"re"};
  var ABBR = {Aprovar:"✓", Ajustar:"✎", Rejeitar:"✕"};

  // ---------- gate ----------
  async function decryptList(password){
    var blob = await fetch("devocionais.enc",{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("arquivo"); return r.json(); });
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(blob.salt), iterations:blob.iter, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(blob.iv)}, key, b64d(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  var gate = document.getElementById("gate"), app = document.getElementById("app");
  function tryPw(pw, onErr){
    decryptList(pw).then(function(data){
      try{ sessionStorage.setItem("pb-pw", pw); }catch(e){}
      gate.classList.add("hidden"); app.classList.remove("hidden");
      boot(); render(data.devocionais || []);
    }).catch(function(){ onErr && onErr(); });
  }
  document.getElementById("gateForm").addEventListener("submit", function(e){
    e.preventDefault();
    document.getElementById("gateErr").textContent = "abrindo…";
    tryPw(document.getElementById("pw").value.trim(), function(){ document.getElementById("gateErr").textContent = "senha incorreta"; });
  });
  var cached = null; try{ cached = sessionStorage.getItem("pb-pw"); }catch(e){}
  if(cached) tryPw(cached, function(){ try{ sessionStorage.removeItem("pb-pw"); }catch(e){} });

  // ---------- review ----------
  var whoEl, segBtns;
  function boot(){
    whoEl = document.getElementById("who");
    whoEl.value = store.__revisor || "";
    whoEl.addEventListener("input", function(){ store.__revisor = whoEl.value.trim(); persist(); });
    segBtns = document.querySelectorAll("#seg button");
    segBtns.forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.papel === store.__papel ? "true" : "false");
      b.addEventListener("click", function(){
        store.__papel = b.dataset.papel; persist();
        segBtns.forEach(function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false"); });
        rerenderStates(); updateProg();
      });
    });
  }
  function papel(){ return store.__papel || "dono"; }
  function dec(id){ return (store[id] || {})[papel()] || null; }

  function send(rec){
    if(!CFG.APPS_SCRIPT_URL) return Promise.resolve(false);
    return fetch(CFG.APPS_SCRIPT_URL, {method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({token:CFG.TOKEN}, rec))})
      .then(function(){return true;}).catch(function(){return false;});
  }
  function decide(dev, status, card){
    var p = papel();
    var notes = card.querySelector("textarea").value.trim();
    store[dev.id] = store[dev.id] || {};
    store[dev.id][p] = { status:status, notas:notes, ts:Date.now() };
    persist();
    paintCard(card, dev);
    updateProg();
    var s = card.querySelector(".saved"); s.textContent = "salvo…";
    send({ id:dev.id, titulo:dev.titulo, papel:p, status:status, notas:notes, revisor:(store.__revisor||"") })
      .then(function(ok){ s.textContent = ok ? "enviado ✓" : (CFG.APPS_SCRIPT_URL ? "envio pendente — use Reenviar" : "salvo no navegador"); });
  }

  function badgeHtml(dev){
    function one(lbl, key){
      var src = (dev.revisao && dev.revisao[key] && dev.revisao[key].status) || null; // do arquivo
      var loc = (store[dev.id] && store[dev.id][key] && store[dev.id][key].status) || null; // desta sessão
      var st = loc || src;
      var cl = st ? " " + (CLS[st]||"") : "";
      return '<span class="badge'+cl+'">'+lbl+': '+(st ? (ABBR[st]||st) : "—")+'</span>';
    }
    return one("Dono","dono") + one("Teólogo","teologo");
  }

  function paintCard(card, dev){
    var p = papel();
    var d = dec(dev.id);
    card.classList.remove("done");
    card.querySelector(".badges").innerHTML = badgeHtml(dev);
    card.querySelectorAll(".actions button").forEach(function(b){
      b.setAttribute("aria-pressed", (d && d.status===b.dataset.act) ? "true" : "false");
    });
    var showNotes = d && (d.status==="Ajustar" || d.status==="Rejeitar");
    card.querySelector(".notes").classList.toggle("show", !!showNotes);
    var ta = card.querySelector("textarea");
    if(d && document.activeElement !== ta) ta.value = d.notas || "";
    card.querySelector(".actlab").textContent = "Seu parecer como " + (p==="dono" ? "dono" : "revisor teológico");
  }
  function rerenderStates(){
    (window.__DEVS||[]).forEach(function(dev,i){
      var card = document.querySelectorAll(".card")[i];
      if(card) paintCard(card, dev);
    });
  }
  function updateProg(){
    var p = papel();
    var devs = window.__DEVS || [];
    var done = devs.filter(function(d){ return (store[d.id]||{})[p] && store[d.id][p].status; }).length;
    document.getElementById("prog").textContent = done + " / " + devs.length + " (" + (p==="dono"?"dono":"teólogo") + ")";
    document.getElementById("barfill").style.width = devs.length ? (done/devs.length*100)+"%" : "0";
  }

  var CHECK = [
    "Soa como um irmão mais velho, não púlpito/coach/vendedor?",
    "Frases curtas, fala com ‘você’, concreto (tem cena/imagem/passo)?",
    "Sem prosperidade, culpa, promessa de resultado, política, marketing?",
    "O versículo realmente sustenta o ponto (não é texto fora de contexto)?",
    "Sem clichê religioso gasto?"
  ];
  function render(devs){
    window.__DEVS = devs;
    var list = document.getElementById("list"); list.innerHTML = "";
    if(!devs.length){ list.innerHTML = '<div class="empty">Nenhum devocional para revisar agora.</div>'; updateProg(); return; }
    devs.forEach(function(d, i){
      var card = document.createElement("article"); card.className = "card";
      card.innerHTML =
        '<div class="badges"></div>'+
        '<span class="num">Devocional '+(i+1)+' de '+devs.length+'</span><h2></h2>'+
        '<div class="verse"><b></b><p></p></div><div class="refl"></div>'+
        '<div class="field"><span class="lab">Aplicação</span><span class="ap-t"></span></div>'+
        '<div class="field"><span class="lab">Oração</span><span class="or-t"></span></div>'+
        '<div class="field"><span class="lab">Pergunta do diário</span><span class="pd-t"></span></div>'+
        '<details><summary>checklist rápido</summary><ul>'+CHECK.map(function(c){return "<li>"+c+"</li>";}).join("")+'</ul></details>'+
        '<div class="actlab"></div>'+
        '<div class="actions">'+
          '<button class="ap" data-act="Aprovar" aria-pressed="false">✓ Aprovar</button>'+
          '<button class="aj" data-act="Ajustar" aria-pressed="false">✎ Ajustar</button>'+
          '<button class="re" data-act="Rejeitar" aria-pressed="false">✕ Rejeitar</button>'+
        '</div><div class="notes"><textarea placeholder="O que ajustar / por que rejeitar (doutrina, uso do versículo, tom)…"></textarea></div>'+
        '<div class="saved"></div>';
      card.querySelector("h2").textContent = d.titulo;
      card.querySelector(".verse b").textContent = d.versiculo.referencia + "  ·  " + d.versiculo.traducao;
      card.querySelector(".verse p").textContent = d.versiculo.texto;
      var refl = card.querySelector(".refl");
      String(d.reflexao).split(/\n+/).forEach(function(p){ var el=document.createElement("p"); el.textContent=p; refl.appendChild(el); });
      card.querySelector(".ap-t").textContent = d.aplicacao;
      card.querySelector(".or-t").textContent = d.oracao;
      card.querySelector(".pd-t").textContent = d.pergunta_diario || "—";
      var ta = card.querySelector("textarea");
      ta.addEventListener("input", function(){
        var d2 = dec(d.id);
        if(d2){ d2.notas = ta.value.trim(); persist(); }
      });
      card.querySelectorAll(".actions button").forEach(function(b){
        b.addEventListener("click", function(){ decide(d, b.dataset.act, card); });
      });
      list.appendChild(card);
      paintCard(card, d);
    });
    updateProg();
  }

  document.getElementById("backup").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(store, null, 2)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "pareceres-backup-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
  });
  document.getElementById("reenviar").addEventListener("click", function(){
    if(!CFG.APPS_SCRIPT_URL){ alert("O envio ainda não foi configurado. Use o backup."); return; }
    var jobs = [];
    Object.keys(store).forEach(function(id){
      if(id.indexOf("__")===0) return;
      ["dono","teologo"].forEach(function(p){
        var d = store[id][p];
        if(d && d.status){
          var dev = (window.__DEVS||[]).filter(function(x){return x.id===id;})[0] || {titulo:""};
          jobs.push(send({ id:id, titulo:dev.titulo, papel:p, status:d.status, notas:d.notas||"", revisor:(store.__revisor||"") }));
        }
      });
    });
    Promise.all(jobs).then(function(){ alert("Reenviado: " + jobs.length); });
  });
})();
</script>
</body>
</html>
